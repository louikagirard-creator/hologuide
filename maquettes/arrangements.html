<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540">
<title>Arrangements HoloGuide</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #fff; color: #111113; font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .box { display: grid; grid-template-columns: 44% 56%; height: 100%; position: relative; }
  .gg { position: relative; background: linear-gradient(#fbfbfa, #f1efeb); overflow: hidden; }
  .gg i { position: absolute; left: 20%; right: 20%; top: 9%; bottom: 3%; border-radius: 110px 110px 36px 36px; background: #e4e0d9; }
  .gg i::before { content: "GG"; position: absolute; top: 34%; left: 0; right: 0; text-align: center; font: 800 26px Arial; color: #8f001a; }
  .gg em { position: absolute; left: 0; right: 0; bottom: 47%; text-align: center; font: 600 11px Arial; color: #a49d92; letter-spacing: .1em; font-style: normal; }
  .p { padding: 18px 16px 16px 12px; display: flex; flex-direction: column; min-height: 0; gap: 10px; position: relative; }
  .mast { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: #3c3c41; padding-bottom: 8px; border-bottom: 1px solid #e3e1dd; }
  .mast b { color: #111; } .mast b::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #8f001a; margin-right: 6px; }
  .tb { display: flex; gap: 5px; align-items: center; }
  .t { height: 32px; min-width: 32px; padding: 0 9px; border: 1px solid #d3d0ca; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; font-weight: 600; background: #fff; }
  .t.on { background: #8f001a; color: #fff; border-color: #8f001a; }
  .grow { flex: 1; }
  .q { font-size: 13px; color: #3c3c41; }
  .a { font-size: 16px; line-height: 1.5; font-weight: 500; }
  .a.sm { font-size: 14px; }
  .h { font-size: 12px; font-weight: 700; color: #3c3c41; padding-bottom: 5px; border-bottom: 1px solid #e3e1dd; }
  .li { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #ece9e4; font-size: 13px; }
  .li::after { content: "›"; color: #6e6e74; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chip { padding: 7px 11px; border: 1px solid #cfccc6; border-radius: 99px; font-size: 12px; background: #fff; }
  .ask { display: flex; gap: 6px; } .in { flex: 1; height: 44px; border: 1px solid #c9c5bf; border-radius: 9px; padding: 13px; font-size: 13px; color: #6e6e74; background: #fff; }
  .btn { height: 44px; min-width: 44px; border-radius: 9px; background: #8f001a; color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; padding: 0 12px; }
  .btn.dark { background: #1d1d1f; } .btn.ghost { background: #fff; color: #111; border: 1px solid #c9c5bf; }
  .map { border-radius: 10px; border: 1px solid #e3e1dd; background:
    linear-gradient(115deg, transparent 47%, #fff 47% 51%, transparent 51%), linear-gradient(25deg, transparent 58%, #fff 58% 61%, transparent 61%),
    radial-gradient(circle at 75% 30%, #e8b4bf 0 13%, transparent 13.5%), radial-gradient(circle at 25% 70%, #3a3a3c 0 7%, transparent 7.5%),
    repeating-linear-gradient(0deg, #ebe7e1 0 18px, #f4f2ee 18px 36px); position: relative; }
  .map::after { content: ""; position: absolute; left: 25%; top: 30%; width: 50%; height: 40%; border-top: 4px solid #8f001a; border-right: 4px solid #8f001a; border-radius: 0 14px 0 0; }
  .step { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; line-height: 1.35; padding: 7px 0; border-bottom: 1px solid #ece9e4; }
  .n { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #8f001a; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .qr { width: 74px; height: 74px; background: repeating-conic-gradient(#111 0 25%, #fff 0 50%) 0 0 / 12px 12px; border: 6px solid #fff; outline: 1px solid #ddd; }
  .note { position: absolute; left: 10px; top: 44px; width: 41%; z-index: 9; background: #fff8e6; border: 1px solid #ecd9a6; border-radius: 8px; padding: 8px 10px; font-size: 11.5px; line-height: 1.35; color: #4a3d16; }
  .tag { position: absolute; left: 10px; top: 10px; z-index: 9; font: 700 12px Arial; color: #fff; background: #111; padding: 6px 9px; border-radius: 4px; }
  .card { border: 1px solid #e3e1dd; border-radius: 12px; padding: 12px; background: #fff; }
  .muted { color: #5e5e64; font-size: 12px; }
  .key { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; } .key span { height: 34px; border-radius: 6px; background: #efede9; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<script>
const MAST = '<div class="mast"><b>HoloGuide</b><span>Holotech · INNOVA</span></div>';
const Q = '<p class="q">« Où est le pavillon Fauteux ? »</p>';
const A = '<p class="a">Le pavillon Fauteux (FTX) est au 57, rue Louis-Pasteur, à 3 minutes à pied. On y trouve la Faculté de droit.</p>';
const ASK = (extra = '') => `<div class="ask"><div class="in">Écris ta question…</div><div class="btn ghost">🎤</div><div class="btn">➤</div>${extra}</div>`;
const STEPS = '<div class="step"><span class="n">1</span>Sors du CRX et prends la privée Louis-Pasteur vers le nord-ouest (200 m).</div><div class="step"><span class="n">2</span>Le pavillon Fauteux est à ta droite.</div>';
const REL = '<p class="h">Questions liées</p><div class="li">Bibliothèque de droit</div><div class="li">Heures de la Faculté de droit</div>';
const TB = '<div class="tb"><span class="t">EN</span><span class="t">⚙ Paramètres</span><span class="t">🕘</span><span class="grow"></span><span class="t">Terminer</span></div>';
const GG = (txt = 'GEE-GEE') => `<div class="gg"><i></i><em>${txt}</em></div>`;
const page = (right, note, left = GG()) => `<div class="box">${left}<div class="p">${right}</div></div><div class="note">${note}</div>`;

const V = {
1: ['Barre en haut + suggestions', page(`${MAST}${TB}${Q}${A}<div class="map" style="height:150px"></div><p class="h">Tu pourrais aussi demander</p><div class="chips"><span class="chip">Bibliothèque de droit</span><span class="chip">Heures</span><span class="chip">Toilettes proches</span><span class="chip">Où manger ?</span></div><div class="grow"></div>${ASK()}`,
  'Version actuelle améliorée : outils en haut, carte sous la réponse, suggestions en puces à toucher.')],
2: ['Outils en bas, près de la main', page(`${MAST}${Q}${A}<div class="map" style="height:170px"></div>${STEPS}<div class="grow"></div><div class="btn" style="height:58px;font-size:16px">🎤 Touche et parle</div><div class="tb"><span class="t">EN</span><span class="t">⚙</span><span class="t">🕘</span><span class="t">⌨ Écrire</span><span class="grow"></span><span class="t">Terminer</span></div>`,
  'Tous les boutons en bas : plus faciles à atteindre pour une personne en fauteuil ou un enfant. Gros bouton « Parler ».')],
3: ['Rail d\'icônes à droite', `<div class="box">${GG()}<div class="p" style="padding-right:64px">${MAST}${Q}${A}<div class="map" style="height:160px"></div>${STEPS}${REL}<div class="grow"></div>${ASK()}</div>
  <div style="position:absolute;right:8px;top:60px;display:flex;flex-direction:column;gap:8px">${['EN','⚙','🕘','🗺','❓','📱','✕'].map((x,i)=>`<span class="t${i===3?' on':''}" style="width:44px;height:44px">${x}</span>`).join('')}</div></div>
  <div class="note">Une colonne d'icônes fixe à droite (langue, paramètres, historique, carte, aide, QR, terminer). Le texte garde toute la largeur.</div>`],
4: ['Onglets Réponse / Carte / Liens', page(`${MAST}<div class="tb"><span class="t on">Réponse</span><span class="t">Carte</span><span class="t">Liens</span><span class="t">Historique</span><span class="grow"></span><span class="t">⚙</span></div>${Q}<p class="a">Le pavillon Fauteux (FTX) est au 57, rue Louis-Pasteur, à 3 minutes à pied. On y trouve la Faculté de droit et la bibliothèque Brian-Dickson, ouverte jusqu'à 22 h.</p>${REL}<div class="grow"></div>${ASK()}`,
  'Onglets en haut : la réponse, la carte, les pages officielles et l\'historique sont séparés. Écran moins chargé.')],
5: ['Conversation en bulles', page(`${MAST}${TB}<div style="align-self:flex-end;background:#8f001a;color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:13px">Où est le pavillon Fauteux ?</div><div style="background:#f3f1ed;padding:10px 12px;border-radius:14px 14px 14px 4px;font-size:14px;line-height:1.45">Le pavillon Fauteux est au 57, rue Louis-Pasteur, à 3 minutes à pied.<div class="map" style="height:110px;margin-top:8px"></div></div><div style="align-self:flex-end;background:#8f001a;color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;font-size:13px">Et la bibliothèque de droit ?</div><div style="background:#f3f1ed;padding:10px 12px;border-radius:14px 14px 14px 4px;font-size:14px">Elle est dans le même pavillon, au 2e étage.</div><div class="grow"></div>${ASK()}`,
  'Style messagerie : on voit toute la conversation qui défile, comme un texto avec Gee-Gee.')],
6: ['Carte d\'abord (orientation)', page(`${MAST}${TB}<div class="map" style="height:300px"></div><p class="a">Pavillon Fauteux · 220 m · 3 min</p>${STEPS}<div class="grow"></div>${ASK()}`,
  'Pour les questions « où est… », la grande carte passe en premier, le texte est réduit au minimum.')],
7: ['Gros micro central', page(`${MAST}${TB}${Q}<p class="a sm">Le pavillon Fauteux (FTX) est au 57, rue Louis-Pasteur, à 3 minutes à pied.</p><div class="grow"></div><div style="display:grid;place-items:center;gap:10px"><div style="width:130px;height:130px;border-radius:50%;background:#8f001a;color:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 0 0 14px rgba(143,0,26,.1)">🎤</div><b>Touche et parle à Gee-Gee</b><span class="muted">ou <u>écris ta question</u></span></div><div class="grow"></div>`,
  'La voix d\'abord : un énorme bouton micro au centre, le clavier est secondaire.')],
8: ['Recherche avec suggestions', page(`${MAST}${TB}<div class="in" style="height:50px;font-size:15px;color:#111;border-color:#8f001a">pavillon fa|</div><div class="card" style="padding:4px 12px"><div class="li">Où est le pavillon <b>Fa</b>uteux ?</div><div class="li">Bibliothèque de droit (pavillon <b>Fa</b>uteux)</div><div class="li"><b>Fa</b>culté des arts : où est-elle ?</div></div><p class="muted">Les suggestions apparaissent pendant que tu écris.</p><div class="grow"></div><div class="map" style="height:160px"></div>`,
  'Pendant qu\'on écrit, les questions de la base apparaissent : on touche la bonne au lieu de tout taper.')],
9: ['Sujets en haut + fil d\'Ariane', page(`${MAST}<div class="chips" style="flex-wrap:nowrap;overflow:hidden"><span class="chip" style="background:#8f001a;color:#fff;border-color:#8f001a">Pavillons</span><span class="chip">Cours</span><span class="chip">Examens</span><span class="chip">Services</span><span class="chip">Santé</span></div><p class="muted">Accueil › Pavillons › Fauteux</p>${A}<div class="map" style="height:140px"></div>${REL}<div class="grow"></div>${ASK()}`,
  'Une rangée de sujets toujours visible en haut et un fil d\'Ariane pour savoir où on est et revenir en arrière.')],
10: ['Réponse courte + « En savoir plus »', page(`${MAST}${TB}${Q}<div class="card"><p class="a">Au 57, rue Louis-Pasteur. 3 min à pied.</p></div><div class="card" style="display:flex;justify-content:space-between"><b style="font-size:13px">🗺 Itinéraire</b><span>▾</span></div><div class="card" style="display:flex;justify-content:space-between"><b style="font-size:13px">🕘 Heures d\'ouverture</b><span>▾</span></div><div class="card" style="display:flex;justify-content:space-between"><b style="font-size:13px">🔗 Pages officielles</b><span>▾</span></div><div class="grow"></div>${ASK()}`,
  'Une réponse en une phrase, puis des sections repliées qu\'on ouvre seulement si on veut plus de détails.')],
11: ['Mode étapes avec progression', page(`${MAST}${TB}<p class="a">Aller au pavillon Fauteux</p><div style="display:flex;gap:4px">${[1,1,0].map(x=>`<span style="flex:1;height:6px;border-radius:3px;background:${x?'#8f001a':'#e3e1dd'}"></span>`).join('')}</div><div class="card"><span class="n" style="width:28px;height:28px;font-size:14px">2</span><p class="a" style="margin-top:8px">À la hauteur du pavillon Fauteux, prends le sentier à gauche.</p><div class="map" style="height:150px;margin-top:10px"></div></div><div class="tb"><span class="t">‹ Précédente</span><span class="grow"></span><span class="t on">Suivante ›</span></div><div class="grow"></div>${ASK()}`,
  'Les directions une étape à la fois, avec une barre de progression et des boutons Précédente / Suivante.')],
12: ['QR toujours visible', page(`${MAST}${TB}${Q}${A}<div class="map" style="height:150px"></div>${REL}<div class="grow"></div><div class="card" style="display:flex;gap:12px;align-items:center"><div class="qr"></div><div><b style="font-size:13px">Emporte ta réponse</b><p class="muted">Scanne pour garder l\'itinéraire sur ton téléphone.</p></div></div>${ASK()}`,
  'Un code QR permanent en bas : on repart avec la réponse et la carte sans attendre la fin de la session.')],
13: ['Barre d\'accessibilité visible', page(`${MAST}<div class="tb" style="background:#f3f1ed;border-radius:10px;padding:6px"><span class="t">A−</span><span class="t">A+</span><span class="t">◐ Contraste</span><span class="t on">🔊 Voix</span><span class="t">EN</span></div>${Q}${A}<div class="map" style="height:140px"></div>${STEPS}<div class="grow"></div>${ASK()}`,
  'Les réglages les plus utiles restent visibles dans une barre grise (au lieu d\'être cachés dans Paramètres).')],
14: ['Bouton Aide / urgence fixe', page(`${MAST}<div class="tb"><span class="t">EN</span><span class="t">⚙</span><span class="grow"></span><span class="t" style="background:#fff3f3;border-color:#d9a1a8;color:#8f001a">☎ Aide</span><span class="t" style="background:#8f001a;color:#fff;border-color:#8f001a">911</span></div>${Q}${A}<div class="map" style="height:150px"></div>${REL}<div class="grow"></div>${ASK()}`,
  'Toujours visibles : un bouton « Aide » (InfoService, Protection) et un bouton urgence 911.')],
15: ['Minuteur de session', page(`${MAST}<div class="tb"><span class="t">EN</span><span class="t">⚙</span><span class="grow"></span><span class="muted">Session 1:42 / 3:00</span><span class="t">↺ Recommencer</span></div><div style="height:5px;border-radius:3px;background:linear-gradient(90deg,#8f001a 57%,#e3e1dd 57%)"></div>${Q}${A}<div class="map" style="height:150px"></div>${REL}<div class="grow"></div>${ASK()}`,
  'Une petite barre montre le temps de la session (3 min recommandées) et un bouton pour tout recommencer.')],
16: ['Grandes tuiles de questions', page(`${MAST}${TB}<p class="a">Salut ! Que cherches-tu ?</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${['🏛 Trouver un pavillon','📚 Bibliothèques','🍔 Où manger','🧾 Mon dossier','🚌 Transport','🎓 Programmes'].map(x=>`<div class="card" style="height:92px;display:flex;align-items:flex-end;font-weight:700;font-size:13px">${x}</div>`).join('')}</div><div class="grow"></div>${ASK()}`,
  'L\'accueil propose 6 grandes tuiles des besoins les plus fréquents, idéal pour un visiteur pressé.')],
17: ['Bilingue côte à côte', page(`${MAST}<div class="tb"><span class="t">⚙</span><span class="t">🕘</span><span class="grow"></span><span class="t">Terminer</span></div>${Q}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><p class="muted">FRANÇAIS</p><p class="a sm">Le pavillon Fauteux est au 57, rue Louis-Pasteur, à 3 minutes à pied.</p></div><div style="border-left:1px solid #e3e1dd;padding-left:10px"><p class="muted">ENGLISH</p><p class="a sm">Fauteux Hall is at 57 Louis-Pasteur Private, a 3-minute walk.</p></div></div><div class="map" style="height:170px"></div><div class="grow"></div>${ASK()}`,
  'La réponse en français ET en anglais en même temps : pas besoin de choisir la langue.')],
18: ['Sous-titres sous Gee-Gee', `<div class="box">${GG()}<div class="p">${MAST}${TB}<div class="map" style="height:240px"></div>${STEPS}${REL}<div class="grow"></div>${ASK()}</div>
  <div style="position:absolute;left:8px;width:42%;bottom:70px;background:rgba(17,17,19,.85);color:#fff;border-radius:10px;padding:10px;font-size:14px;line-height:1.4">Le pavillon Fauteux est au 57, rue <b style="color:#ffb3c0">Louis-Pasteur</b>…</div></div>
  <div class="note">Ce que Gee-Gee dit s'affiche en sous-titres sous lui (comme à la télé) ; le panneau de droite garde la carte et les infos.</div>`],
19: ['Clavier tactile intégré', page(`${MAST}${TB}${Q}<p class="a sm">Le pavillon Fauteux (FTX) est au 57, rue Louis-Pasteur, à 3 minutes à pied.</p><div class="map" style="height:120px"></div><div class="grow"></div><div class="in" style="color:#111">où est la bibli|</div><div class="key">${'azertyuiopqsdfghjklmwxcvbn'.split('').map(c=>`<span>${c}</span>`).join('')}<span style="grid-column:span 2">⌫</span><span style="grid-column:span 6">espace</span><span style="grid-column:span 2;background:#8f001a;color:#fff">OK</span></div>`,
  'Un clavier AZERTY dessiné à l\'écran, adapté au tactile de la boîte (pas besoin de clavier physique).')],
20: ['Mode simple (3 gros choix)', page(`${MAST}<div class="tb"><span class="t">EN</span><span class="grow"></span><span class="t">Mode complet</span></div><p class="a" style="font-size:22px;font-weight:700">Comment je peux t\'aider ?</p>${['🗺  Trouver un endroit','❓  Poser une question','☎  Parler à quelqu\'un'].map(x=>`<div class="btn" style="height:86px;font-size:18px;justify-content:start;display:flex;align-items:center;padding:0 18px;border-radius:14px">${x}</div>`).join('')}<div class="grow"></div><p class="muted" style="text-align:center">Touche un bouton ou parle-moi</p>`,
  'Un écran très simple avec 3 énormes boutons pour ceux qui ne veulent pas lire beaucoup. On peut passer au mode complet.')]
};
const n = Number(new URLSearchParams(location.search).get('v')) || 1;
document.body.innerHTML = V[n][1] + `<div class="tag">${n} · ${V[n][0]}</div>`;
</script>
</body>
</html>
