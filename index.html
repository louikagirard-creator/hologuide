<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoloGuide · Boîte Holotech d'INNOVA</title>
<meta name="description" content="HoloGuide : guide d'information de l'Université d'Ottawa pour la boîte Holotech d'INNOVA, avec Gee-Gee.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" media="print" onload="this.media='all'">
</head>
<!-- Fond blanc. Gee-Gee est debout à gauche, sur toute la hauteur de la boîte Holotech d'INNOVA ; l'interface est à droite. -->
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M8.5 21.5h7"/></g></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12M11 5l7 7-7 7"/></g></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4v4.5H8"/><path d="M12 7.5V12l3 2"/></g></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></g></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></g></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></g></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5"/><path d="M10.5 9.5v5l4-2.5z"/></g></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.3 2.8-.6.6 2.8 2.3 1.6-1.2 2.6 1.2 2.6-2.3 1.6-.6 2.8-2.8-.6L12 21.2l-1.6-2.3-2.8.6-.6-2.8-2.3-1.6 1.2-2.6-1.2-2.6 2.3-1.6.6-2.8 2.8.6z"/></g></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></g></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></g></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M13.5 10h.01M17 10h.01M6.5 14h.01M17 14h.01M9.5 14h5"/></g></symbol>
  <symbol id="i-exit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4"/><path d="M10 8l-4 4 4 4M6 12h9"/></g></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
  <symbol id="i-contrast" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></g></symbol>
</svg>

<div class="box">
<!-- Colonne de gauche : l'hologramme de Gee-Gee, en pied, sur toute la hauteur de la boîte -->
<figure class="holo" id="holo" aria-hidden="true"><div class="holo-stage" id="stage"></div></figure>

<!-- Colonne de droite : l'interface -->
<div class="panel">
<header class="masthead">
  <button class="wordmark" id="brand" type="button">HoloGuide</button>
  <span class="where">Holotech <span class="sep">·</span> INNOVA</span>
</header>

<!-- 1. Veille -->
<section id="attract" class="screen active" tabindex="0" aria-label="Commencer · Start">
  <div class="intro">
    <p class="eyebrow">Bonjour <span class="sep">/</span> Hello</p>
    <h1 class="display" data-t="attractTitle"></h1>
    <p class="lead" data-t="attractSub"></p>
    <p class="lead second" id="attractEn"></p>
  </div>
  <div class="intro-foot">
    <button class="primary" type="button"><span data-t="touchStart"></span><span class="arrow" aria-hidden="true">→</span></button>
    <p class="tip" id="tip" aria-live="polite"></p>
  </div>
</section>

<!-- 2. Accueil : langue et profil -->
<section id="start" class="screen" aria-labelledby="welcomeTitle">
  <h1 id="welcomeTitle" class="title" data-t="welcome"></h1>
  <p class="label" data-t="chooseLang"></p>
  <div class="choices two">
    <button class="choice" data-lang="fr"><span class="code">FR</span><span class="word">Français</span></button>
    <button class="choice" data-lang="en"><span class="code">EN</span><span class="word">English</span></button>
  </div>
  <p class="label" data-t="chooseProfile"></p>
  <div class="choices">
    <button class="choice" data-profile="student"><span class="code">01</span><span class="word" data-profile-label></span></button>
    <button class="choice" data-profile="staff"><span class="code">02</span><span class="word" data-profile-label></span></button>
    <button class="choice" data-profile="visitor"><span class="code">03</span><span class="word" data-profile-label></span></button>
  </div>
  <button class="primary" id="go" type="button"><span data-t="go"></span><span class="arrow" aria-hidden="true">→</span></button>
  <p class="fine" data-t="privacy"></p>
</section>

<!-- 3. Conversation : une seule réponse à la fois, sous-titrée pendant que Gee-Gee parle -->
<section id="chat" class="screen">
  <main id="view" class="view" aria-live="polite"></main>
  <!-- Tous les boutons en bas, faciles à atteindre (personne en fauteuil, enfant) -->
  <div class="dock">
    <form id="askForm" class="askbar" hidden>
      <label class="sr" for="askInput" data-t="ask"></label>
      <input id="askInput" autocomplete="off" enterkeyhint="send" data-ph="askPh">
      <button type="submit" class="send" data-aria="send"><svg><use href="#i-send"/></svg></button>
    </form>
    <div class="talkrow">
      <button type="button" id="micBtn" class="talk"><svg><use href="#i-mic"/></svg><span id="talkLabel" data-t="talk"></span></button>
      <button type="button" id="typeBtn" class="dock-btn type" aria-pressed="false"><svg><use href="#i-keyboard"/></svg><span data-t="type"></span></button>
    </div>
    <nav class="dockbar">
      <button id="langBtn" class="dock-btn"><svg><use href="#i-globe"/></svg><span id="langLabel"></span></button>
      <button id="historyBtn" class="dock-btn"><svg><use href="#i-history"/></svg><span data-t="history"></span><span class="count" id="histCount" hidden></span></button>
      <button id="settingsBtn" class="dock-btn"><svg><use href="#i-settings"/></svg><span data-t="settings"></span></button>
      <button id="endBtn" class="dock-btn end"><svg><use href="#i-exit"/></svg><span data-t="end"></span></button>
    </nav>
  </div>
</section>

<!-- 4. Fin : code QR et satisfaction -->
<section id="end" class="screen">
  <h1 class="title" data-t="endTitle"></h1>
  <p class="lead" id="qrText"></p>
  <div id="qr" class="qr"></div>
  <p class="label" data-t="rate"></p>
  <div class="choices three" id="rating">
    <button class="choice" data-rate="0"><span class="word" data-t="rate0"></span></button>
    <button class="choice" data-rate="1"><span class="word" data-t="rate1"></span></button>
    <button class="choice" data-rate="2"><span class="word" data-t="rate2"></span></button>
  </div>
  <button class="primary" id="doneBtn" type="button"><span data-t="done"></span></button>
  <p class="fine" id="closing"></p>
</section>
</div>
</div>

<!-- Historique (transcription complète de la session) -->
<div id="history" class="overlay" hidden role="dialog" aria-labelledby="historyTitle">
  <div class="drawer">
    <div class="drawer-head"><h2 id="historyTitle" data-t="history"></h2><button class="tool" id="closeHistory" data-aria="close"><svg><use href="#i-close"/></svg></button></div>
    <ol id="historyList" class="history"></ol>
  </div>
</div>

<!-- Paramètres : langue, taille du texte, contraste, voix… (remis par défaut pour chaque nouvelle personne) -->
<div id="settings" class="overlay" hidden role="dialog" aria-labelledby="settingsTitle">
  <div class="card settings">
    <div class="drawer-head"><h2 id="settingsTitle" data-t="settings"></h2><button class="tool" id="closeSettings" data-aria="close"><svg><use href="#i-close"/></svg></button></div>
    <div id="settingsRows"></div>
    <div class="row"><button class="quiet" id="resetSettings" data-t="resetSettings"></button><button class="primary" id="doneSettings" data-t="ok"></button></div>
  </div>
</div>

<!-- Plan agrandi -->
<div id="lightbox" class="overlay" hidden role="dialog"><img id="lightboxImg" alt=""><div id="lightboxMap" class="lightbox-map"></div><button class="tool close-corner" id="closeLightbox" data-aria="close"><svg><use href="#i-close"/></svg></button></div>

<!-- Inactivité -->
<div id="idle" class="overlay" hidden role="alertdialog" aria-labelledby="idleTitle">
  <div class="card"><h2 id="idleTitle" class="title" data-t="idleTitle"></h2><p class="countdown" id="idleText"></p><button class="primary" id="stayBtn" data-t="stay"></button></div>
</div>

<!-- Tableau de bord (5 touches sur « HoloGuide » ou Maj+A) -->
<div id="admin" class="overlay" hidden role="dialog" aria-labelledby="adminTitle">
  <div class="card"><h2 id="adminTitle" class="title" data-t="admin"></h2><dl id="stats" class="stats"></dl>
    <div class="row"><button class="quiet" id="resetStats" data-t="reset"></button><button class="primary" id="closeAdmin" data-t="close"></button></div></div>
</div>

<script src="vendor/qrcode.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
