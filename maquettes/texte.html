<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540">
<title>Styles de texte HoloGuide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Open+Sans:wght@400;600;700;800&family=Lato:wght@400;700;900&family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&family=Source+Sans+3:wght@400;600;700;800&family=Work+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Rubik:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 540px; height: 960px; overflow: hidden; background: #fff; color: #111113; }
  .box { display: grid; grid-template-columns: 46% 54%; height: 100%; }
  .gg { position: relative; background: linear-gradient(#fafafa, #f1f0ee); }
  .gg span { position: absolute; left: 50%; bottom: 46%; transform: translateX(-50%); font: 600 13px Arial; color: #b0aaa0; letter-spacing: .08em; }
  .gg i { position: absolute; left: 22%; right: 22%; top: 12%; bottom: 4%; border-radius: 120px 120px 40px 40px; background: #e6e2dc; }
  .panel { padding: 22px 18px 18px 14px; display: flex; flex-direction: column; font-family: var(--f); }
  .mast { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,.14); font-size: 11px; color: #3c3c41; }
  .mast b { color: #111; font-weight: var(--hw); } .mast b::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #8f001a; margin-right: 6px; }
  .tools { display: flex; gap: 5px; margin: 12px 0 14px; } .tools span { width: 30px; height: 30px; border: 1px solid rgba(0,0,0,.18); border-radius: 6px; font-size: 11px; display: grid; place-items: center; font-weight: 600; color: #3c3c41; }
  .tools .end { width: auto; padding: 0 10px; margin-left: auto; color: #111; }
  .q { font-size: calc(var(--s) * .78); color: #3c3c41; margin-bottom: 8px; font-style: var(--qi); }
  .a { font-size: var(--s); line-height: var(--lh); font-weight: var(--w); letter-spacing: var(--ls); color: #111113; }
  .a mark { background: none; color: #111; font-weight: var(--hw); }
  .h { margin-top: 18px; font-size: 12px; font-weight: var(--hw); color: #3c3c41; text-transform: var(--tt); letter-spacing: var(--hls); padding-bottom: 6px; border-bottom: 1px solid rgba(0,0,0,.14); }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid rgba(0,0,0,.1); font-size: calc(var(--s) * .8); line-height: 1.4; }
  .step b { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #8f001a; color: #fff; font-size: 11px; display: grid; place-items: center; }
  .li { display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgba(0,0,0,.1); font-size: calc(var(--s) * .82); font-weight: var(--lw); }
  .li::after { content: "›"; color: #5e5e64; }
  .grow { flex: 1; }
  .ask { display: flex; gap: 6px; } .ask div { flex: 1; height: 44px; border: 1px solid rgba(0,0,0,.25); border-radius: 8px; padding: 13px; font-size: 13px; color: #5e5e64; }
  .ask span { width: 44px; height: 44px; border-radius: 8px; background: #8f001a; }
  .tag { position: absolute; left: 12px; top: 12px; font: 700 12px Arial; color: #fff; background: #111; padding: 6px 9px; border-radius: 4px; }
</style>
</head>
<body>
<script>
// [nom, police, taille réponse, poids réponse, interligne, poids titres, espacement, majuscules des rubriques, poids des listes, question en italique]
const V = [
  ['Inter', 'Inter', 19, 500, 1.5, 700, '-0.01em', 'none', 500, 'normal'],
  ['Roboto', 'Roboto', 19, 400, 1.55, 700, '0', 'uppercase', 500, 'normal'],
  ['Open Sans', 'Open Sans', 18, 400, 1.6, 700, '0', 'none', 600, 'normal'],
  ['Lato', 'Lato', 19, 400, 1.55, 900, '0', 'uppercase', 700, 'italic'],
  ['Montserrat', 'Montserrat', 17, 500, 1.6, 700, '0', 'uppercase', 600, 'normal'],
  ['Poppins', 'Poppins', 17, 400, 1.65, 600, '0', 'none', 500, 'normal'],
  ['Nunito (arrondie)', 'Nunito', 19, 600, 1.5, 800, '0', 'none', 700, 'normal'],
  ['Source Sans 3', 'Source Sans 3', 20, 400, 1.5, 700, '0', 'uppercase', 600, 'italic'],
  ['Work Sans', 'Work Sans', 18, 400, 1.55, 600, '0', 'none', 500, 'normal'],
  ['DM Sans', 'DM Sans', 19, 400, 1.5, 700, '-0.01em', 'none', 500, 'normal'],
  ['Manrope', 'Manrope', 18, 500, 1.55, 800, '0', 'none', 600, 'normal'],
  ['IBM Plex Sans', 'IBM Plex Sans', 18, 400, 1.55, 600, '0', 'uppercase', 500, 'italic'],
  ['Rubik', 'Rubik', 18, 400, 1.55, 600, '0', 'none', 500, 'normal'],
  ['Outfit', 'Outfit', 20, 400, 1.45, 600, '0', 'none', 500, 'normal'],
  ['Figtree', 'Figtree', 19, 500, 1.5, 800, '0', 'uppercase', 600, 'normal'],
  ['Lexend (très lisible)', 'Lexend', 18, 400, 1.55, 600, '-0.01em', 'none', 500, 'normal'],
  ['Atkinson Hyperlegible (accessibilité)', 'Atkinson Hyperlegible', 19, 400, 1.5, 700, '0', 'none', 700, 'normal'],
  ['Plus Jakarta Sans', 'Plus Jakarta Sans', 18, 500, 1.55, 800, '-0.01em', 'none', 600, 'normal'],
  ['Public Sans (gouvernement)', 'Public Sans', 19, 400, 1.55, 700, '0', 'uppercase', 600, 'normal'],
  ['Noto Sans (grande taille)', 'Noto Sans', 21, 500, 1.45, 700, '0', 'none', 600, 'normal']
];
const n = Number(new URLSearchParams(location.search).get('v')) || 1;
const [label, f, s, w, lh, hw, ls, tt, lw, qi] = V[n - 1];
document.documentElement.style.cssText = `--f:"${f}",sans-serif;--s:${s}px;--w:${w};--lh:${lh};--hw:${hw};--ls:${ls};--tt:${tt};--hls:${tt === 'uppercase' ? '.1em' : '0'};--lw:${lw};--qi:${qi}`;
document.body.innerHTML = `<div class="box"><div class="gg"><i></i><span>GEE-GEE</span></div><div class="panel">
  <div class="mast"><b>HoloGuide</b><span>Holotech · INNOVA</span></div>
  <div class="tools"><span>EN</span><span>Aa</span><span>◐</span><span>♪</span><span class="end">Terminer</span></div>
  <p class="q">« Où est le pavillon Fauteux ? »</p>
  <p class="a">Le <mark>pavillon Fauteux (FTX)</mark> est au 57, rue Louis-Pasteur. On y trouve la Faculté de droit et la bibliothèque Brian-Dickson. C'est à 3 minutes à pied d'ici.</p>
  <p class="h">Itinéraire depuis ici</p>
  <div class="step"><b>1</b><span>Sors du pavillon CRX et prends la privée Louis-Pasteur vers le nord-ouest sur environ 200 m.</span></div>
  <div class="step"><b>2</b><span>Le pavillon Fauteux (FTX) est à ta droite.</span></div>
  <p class="h">Questions liées</p>
  <div class="li">Où est la bibliothèque de droit ?</div>
  <div class="li">Heures de la Faculté de droit</div>
  <div class="grow"></div>
  <div class="ask"><div>Écris ta question…</div><span></span></div>
</div></div><div class="tag">${n} · ${label}</div>`;
</script>
</body>
</html>
