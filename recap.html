<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HoloGuide · Récapitulatif de ta conversation</title>
<link rel="icon" href="data:,">
<style>
  :root { --accent: #8f001a; --ink: #111; --soft: #f4f2ee; --line: #ddd8d0; --mute: #555; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1.2rem 3rem; background: #fff; color: var(--ink);
    font: 1.05rem/1.55 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500;
  }
  .doc { max-width: 46rem; margin: 0 auto; }
  .mark { margin: 0; font-weight: 800; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  h1 { margin: .35rem 0 .6rem; font-size: 1.7rem; line-height: 1.2; font-weight: 800; }
  .lead { margin: 0 0 .3rem; font-size: 1.05rem; font-weight: 600; }
  .meta { margin: 0 0 1.6rem; font-size: .9rem; font-weight: 600; color: var(--mute); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  ol > li { background: var(--soft); border-radius: 14px; padding: 1rem 1.1rem; }
  .q { margin: 0 0 .5rem; font-size: 1.05rem; font-weight: 800; }
  .a { margin: 0 0 .7rem; }
  .src-label { margin: .2rem 0 .35rem; font-size: .78rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); }
  .src { list-style: none; margin: 0; padding: 0; display: grid; gap: .2rem; }
  .src a { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; word-break: break-word; }
  .bar { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.6rem; }
  .btn {
    appearance: none; border: 2px solid var(--ink); background: #fff; color: var(--ink); font: inherit; font-weight: 800;
    padding: .7rem 1.15rem; border-radius: 999px; text-decoration: none; cursor: pointer;
  }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
  .foot { margin-top: 2rem; padding-top: 1rem; border-top: 2px solid var(--ink); font-size: .88rem; font-weight: 600; }
  .foot a { color: var(--accent); font-weight: 700; word-break: break-word; }
  @media print {
    body { padding: 0; font-size: 11pt; }
    .bar { display: none; }
    ol > li { background: #fff; border: 1px solid var(--line); break-inside: avoid; }
    .src a { color: var(--ink); }
  }
</style>
</head>
<!-- Document remis par le code QR de fin de session : questions, réponses et pages officielles source. -->
<body>
<main class="doc">
  <p class="mark">HoloGuide</p>
  <h1 id="recapTitle">Récapitulatif de ta conversation</h1>
  <p class="lead" id="recapLead"></p>
  <p class="meta" id="recapMeta"></p>
  <ol id="recap"></ol>
  <div class="bar">
    <button class="btn solid" id="printBtn" type="button">Imprimer ou enregistrer en PDF</button>
    <a class="btn" id="backLink" href="index.html">Retour à HoloGuide</a>
  </div>
  <footer class="foot" id="recapFoot"></footer>
</main>
<script type="module" src="js/recap.js"></script>
</body>
</html>
